<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a3a2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ওয়ান টু ওয়ান লাইব্রেরি">
  <title>ওয়ান টু ওয়ান লাইব্রেরি</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" class="splash">
  <div class="splash-inner">
    <div class="splash-logo">📚</div>
    <h1 class="splash-title">ওয়ান টু ওয়ান</h1>
    <p class="splash-sub">অনলাইন লাইব্রেরি</p>
    <div class="splash-loader"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="authScreen" class="screen hidden">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <div class="auth-logo">📚</div>
    <h2 class="auth-title">ওয়ান টু ওয়ান লাইব্রেরি</h2>
    <p class="auth-sub" id="authSubText">স্বাগতম! প্রবেশ করতে নম্বর দিন</p>
    <div class="input-group">
      <label>মোবাইল নম্বর</label>
      <input type="tel" id="authPhone" placeholder="01XXXXXXXXX" oninput="onPhoneInput(this.value)">
    </div>
    <div id="registerFields" style="display:none;">
      <div class="input-group"><label>আপনার নাম *</label><input type="text" id="regName" placeholder="পূর্ণ নাম লিখুন"></div>
      <div class="input-group"><label>গ্রাম / এলাকা *</label><input type="text" id="regVillage" placeholder="গ্রাম বা এলাকার নাম"></div>
      <div class="input-group"><label>উপজেলা *</label><input type="text" id="regUpazila" placeholder="উপজেলার নাম"></div>
      <div class="input-group"><label>জেলা *</label><input type="text" id="regDistrict" placeholder="জেলার নাম"></div>
    </div>
    <button class="btn-primary" id="authBtn" onclick="handleAuth()">প্রবেশ করুন</button>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">📚</span>
      <span class="topbar-name">ওয়ান টু ওয়ান</span>
    </div>
    <div class="topbar-right">
      <span class="user-greeting" id="userGreeting"></span>
      <button class="icon-btn" onclick="showProfile()">👤</button>
    </div>
  </header>
  <main class="main-content" id="mainContent"></main>
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="navigate('home')">
      <span class="nav-icon">🏠</span><span class="nav-label">হোম</span>
    </button>
    <button class="nav-btn" id="nav-ebook" onclick="navigate('ebook')">
      <span class="nav-icon">📖</span><span class="nav-label">ই-বুক</span>
    </button>
    <button class="nav-btn" id="nav-bookshop" onclick="navigate('bookshop')">
      <span class="nav-icon">🛍️</span><span class="nav-label">বই কিনুন</span>
    </button>
    <button class="nav-btn" id="nav-personal" onclick="navigate('personal')">
      <span class="nav-icon">🏡</span><span class="nav-label">ব্যক্তিগত</span>
    </button>
    <button class="nav-btn" id="nav-dashboard" onclick="navigate('dashboard')">
      <span class="nav-icon">📊</span><span class="nav-label">ড্যাশবোর্ড</span>
    </button>
  </nav>
</div>

<div id="modal" class="modal-overlay hidden" onclick="closeModal(event)">
  <div class="modal-box" id="modalBox"></div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="home.js"></script>
<script src="ebook.js"></script>
<script src="bookshop.js"></script>
<script src="personal.js"></script>
<script src="dashboard.js"></script>
<script src="app.js"></script>
</body>
</html>
